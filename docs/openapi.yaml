openapi: 3.0.3
info:
  title: ATA RAG Chat API
  version: 0.1.0
  description: API contract for the akademiata.pl RAG chatbot.
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /health:
    get:
      summary: Coolify / Traefik health probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: ata-rag-chat-be
  /api/chat:
    post:
      summary: Ask a grounded question (SSE)
      operationId: chat
      description: |
        Implemented in branch `be/rag-chat-api`.
        SSE event sequence: `sources` → `token*` → `done`.
        Low-confidence requests return no sources, a graceful unknown token stream,
        and `done.answered=false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid or unsafe question
  /api/chat/feedback:
    post:
      summary: Rate a chat answer as helpful or not helpful
      operationId: chatFeedback
      description: |
        Public idempotent endpoint. Clients may change their vote by posting again
        with the same query_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatFeedbackRequest"
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatFeedbackResponse"
        "400":
          description: Invalid payload
        "404":
          description: Chat query not found
  /api/admin/summary:
    get:
      summary: Knowledge-base and retrieval summary
      operationId: adminSummary
      security:
        - basicAuth: []
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Missing or invalid admin credentials
  /api/admin/failed-pages:
    get:
      summary: Failed crawl pages
      operationId: adminFailedPages
      security:
        - basicAuth: []
      responses:
        "200":
          description: Failed pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FailedPage"
        "401":
          description: Missing or invalid admin credentials
  /api/admin/questions:
    get:
      summary: Top and unanswered questions
      operationId: adminQuestions
      security:
        - basicAuth: []
      responses:
        "200":
          description: Question analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionsResponse"
        "401":
          description: Missing or invalid admin credentials
  /api/admin/feedback:
    get:
      summary: Helpful / not-helpful answer ratings
      operationId: adminFeedback
      security:
        - basicAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Feedback analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedback"
        "401":
          description: Missing or invalid admin credentials
  /api/admin/sync:
    post:
      summary: Trigger website crawl sync
      operationId: adminSync
      security:
        - basicAuth: []
      responses:
        "202":
          description: Sync accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"
        "401":
          description: Missing or invalid admin credentials
        "409":
          description: Another sync job is already running
  /api/admin/prices/sync:
    post:
      summary: Trigger pricing JSON ingest (Apps Script)
      operationId: adminPricesSync
      security:
        - basicAuth: []
      responses:
        "202":
          description: Pricing sync accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"
        "401":
          description: Missing or invalid admin credentials
        "409":
          description: Another sync job is already running
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ChatRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    Source:
      type: object
      required: [title, url, sourceType, score]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        section:
          type: string
        sourceType:
          type: string
          enum: [html, pdf, pricing]
        score:
          type: number
          minimum: 0
          maximum: 1
    AdminSummary:
      type: object
      properties:
        page_count:
          type: integer
        chunk_count:
          type: integer
        last_crawl:
          $ref: "#/components/schemas/CrawlRun"
        failed_page_count:
          type: integer
        avg_confidence:
          type: number
        avg_latency_ms:
          type: number
        total_questions:
          type: integer
        answered_questions:
          type: integer
        unanswered_questions:
          type: integer
        helpful_count:
          type: integer
        not_helpful_count:
          type: integer
        feedback_rate:
          type: number
          nullable: true
        active_sync_job:
          type: string
          nullable: true
    ChatFeedbackRequest:
      type: object
      required: [queryId, helpful]
      properties:
        queryId:
          type: string
          format: uuid
        helpful:
          type: boolean
    ChatFeedbackResponse:
      type: object
      properties:
        query_id:
          type: string
          format: uuid
        helpful:
          type: boolean
        feedback_at:
          type: string
          format: date-time
    AdminFeedback:
      type: object
      properties:
        helpful_count:
          type: integer
        not_helpful_count:
          type: integer
        feedback_rate:
          type: number
          nullable: true
        recent:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              question:
                type: string
              answer:
                type: string
              helpful:
                type: boolean
              created_at:
                type: string
                format: date-time
              feedback_at:
                type: string
                format: date-time
    CrawlRun:
      type: object
      properties:
        id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
        pages_discovered:
          type: integer
        pages_updated:
          type: integer
        pages_failed:
          type: integer
        pages_removed:
          type: integer
    FailedPage:
      type: object
      properties:
        url:
          type: string
        http_status:
          type: integer
        error_message:
          type: string
    SyncJob:
      type: object
      required: [job, status, submitted_at]
      properties:
        job:
          type: string
          enum: [website, pricing]
        status:
          type: string
          example: accepted
        submitted_at:
          type: string
          format: date-time
    QuestionsResponse:
      type: object
      properties:
        top_questions:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              count:
                type: integer
        unanswered:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              created_at:
                type: string
                format: date-time
