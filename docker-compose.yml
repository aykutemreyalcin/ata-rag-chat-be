services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ata-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ata_rag}
      POSTGRES_USER: ${POSTGRES_USER:-ata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ata_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ata} -d ${POSTGRES_DB:-ata_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: ata-rag-be
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ata_rag}
      POSTGRES_USER: ${POSTGRES_USER:-ata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ata}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CRAWL_BASE_URL: ${CRAWL_BASE_URL:-https://akademiata.pl}
      PRICING_API_URL: ${PRICING_API_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.55}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  ata_rag_pgdata:
