spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:ata_rag;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

app:
  cors:
    allowed-origins: http://localhost:5173
  rag:
    crawl-base-url: https://akademiata.pl
    pricing-api-url: ""
    pricing-citation-url: https://akademiata.pl/kalkulator-czesnego/
    openai-api-key: ""
    openai-base-url: https://api.openai.com/v1
    openai-model: gpt-4.1-mini
    embedding-model: text-embedding-3-small
    embedding-dimensions: 1536
    confidence-threshold: 0.55
    basic-auth-user: admin
    basic-auth-password: test-secret
    crawl-max-pages: 3
    crawl-timeout-seconds: 5
    scheduler-enabled: false
    user-agent: AkademiaTA-RAG-Bot-Test/1.0
  vertex-ai:
    enabled: false
    project-id: ""
    region: europe-west1
    model-name: gemini-2.5-flash
    credentials-path: ""
