spring:
  application:
    name: ata-rag-chat-be
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rag:
    crawl-base-url: ${CRAWL_BASE_URL:https://akademiata.pl}
    pricing-api-url: ${PRICING_API_URL:}
    pricing-citation-url: ${PRICING_CITATION_URL:https://akademiata.pl/kalkulator-czesnego/}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
    confidence-threshold: ${CONFIDENCE_THRESHOLD:0.55}
    basic-auth-user: ${BASIC_AUTH_USER:}
    basic-auth-password: ${BASIC_AUTH_PASSWORD:}
    crawl-max-pages: ${CRAWL_MAX_PAGES:0}
    crawl-timeout-seconds: ${CRAWL_TIMEOUT_SECONDS:20}
    scheduler-enabled: ${INGEST_SCHEDULER_ENABLED:true}
    user-agent: ${CRAWL_USER_AGENT:AkademiaTA-RAG-Bot/1.0}
  vertex-ai:
    enabled: ${VERTEX_AI_ENABLED:false}
    project-id: ${GCP_PROJECT_ID:}
    region: ${GCP_REGION:europe-west1}
    model-name: ${GCP_GEMINI_MODEL:gemini-2.5-flash}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}

logging:
  level:
    com.ata.rag: INFO
    org.springframework.web: INFO
